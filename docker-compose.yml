services:
  app:
    build: ./
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ToDo
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_LOCALE: ja
      # 初回起動時にデモデータ（タスク100件）を投入する。不要なら false に
      SEED_DATABASE: "true"
      # ログイン画面の「デモアカウントでログイン」ボタン
      DEMO_LOGIN_ENABLED: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: dev
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.3
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dev
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
