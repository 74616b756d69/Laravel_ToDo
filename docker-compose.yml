services:
  app:
    build: ./
    ports:
      - "8000:8000"
    environment: &app-env
      APP_NAME: Tracklet
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_LOCALE: ja
      # 初回起動時にデモデータ（タスク100件）を投入する。不要なら false に
      SEED_DATABASE: "true"
      # ログイン画面の「デモアカウントでログイン」ボタン
      DEMO_LOGIN_ENABLED: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: dev
      DB_USERNAME: root
      DB_PASSWORD: password
      # リアルタイム更新（Laravel Reverb）。ID と鍵は開発用の固定値。本番では必ず変えること
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "100001"
      REVERB_APP_KEY: tracklet-dev-key
      REVERB_APP_SECRET: tracklet-dev-secret
      # サーバー（キューのワーカー）から見た Reverb の在りか
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      # ブラウザから見た Reverb の在りか
      REVERB_PUBLIC_HOST: localhost
      REVERB_PUBLIC_PORT: "8080"
      REVERB_PUBLIC_SCHEME: http
    volumes:
      # 発行したアプリケーションキーを保存しておく場所（queue と共有する）
      - app_state:/workdir/state
      # 課題の添付ファイル。コンテナを作り直しても消えないようにする
      - attachments:/workdir/laravel_app/storage/app/private/attachments
    depends_on:
      db:
        condition: service_healthy
    # キューのワーカーは、マイグレーションが終わってから起動させたいので
    # 「Web が応答する」ことを準備完了の合図にする
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30

  # キューのワーカー。通知メールなど、リクエストの外でやる処理を受け持つ
  queue:
    build: ./
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]
    environment:
      <<: *app-env
      # マイグレーションとシードは app コンテナが受け持つ（同時に流すと競合する）
      CONTAINER_ROLE: worker
    volumes:
      - app_state:/workdir/state
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # リアルタイム更新の WebSocket サーバー。ボードや課題の画面がここにつながる
  reverb:
    build: ./
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    ports:
      - "8080:8080"
    volumes:
      - app_state:/workdir/state
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # 定期実行（古い Webhook 配信履歴の掃除など）。routes/console.php の Schedule を回す
  scheduler:
    build: ./
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    volumes:
      - app_state:/workdir/state
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.3
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: dev
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  app_state:
  attachments:
